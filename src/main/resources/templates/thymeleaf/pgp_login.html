<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        a {
            color: #ffffff;
            text-decoration: underline;
        }

        :root {
            --bg: #12141a;
            --surface: #1c1f26;
            --surface-hover: #252a33;
            --border: #343a46;
            --text-primary: #d1d5db;
            --text-secondary: #a1a7b1;
            --accent: #434491;
            --accent-soft: #1e2a44;
            --danger: #c04a4a;
            --danger-soft: #3d1a1a;
            --muted: #717a8c;

            --radius: 1px;
            --shadow: 0 2px 4px rgba(0, 0, 0, 0.5);

            --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --font-serif: 'Georgia', serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem 1rem 4rem;
            min-height: 100vh;
            line-height: 1.5;
            display: flex;
            justify-content: center;
        }

        /* ── Site Banner ── */
        .site_banner {
            max-width: 760px;
            margin: 0 auto 2rem;
            padding: 2rem 2.5rem;
            text-align: center;
            background: linear-gradient(180deg, var(--accent-soft), var(--surface));
            border: 1px solid var(--border);
            border-top: 3px solid var(--accent);
            color: var(--text-primary);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            font-family: var(--font-serif);
        }

        .site_banner h1 {
            margin: 0 0 0.6rem;
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        .site_banner h2 {
            margin: 0 0 0.8rem;
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--text-secondary);
            font-style: italic;
        }

        .site_banner h3 {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            font-family: var(--font);
        }
        .card {
            background: var(--surface);
            padding: 2rem 2.25rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin: auto;
            width: 100%;
            max-width: 360px;
        }

        .card h1 {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--text-primary);
        }

        /* ── Form ── */
        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 0.9rem;
            color: var(--text-primary);
            background: var(--bg);
            transition: border-color 0.15s;
            outline: none;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--accent);
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.55rem 1.25rem;
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 0.875rem;
            font-weight: 600;
            border: 1.5px solid transparent;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.15s, transform 0.1s;
            line-height: 1;
        }
        .btn:active { transform: scale(0.97); }

        .btn-submit {
            width: 100%;
            margin-top: 0.5rem;
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-submit:hover { opacity: 0.88; }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--border);
        }
        .btn-secondary:hover { background: var(--surface-hover); }

        .card-footer {
            margin-top: 1rem;
            display: flex;
            justify-content: center;
        }

        /* ── Flash messages ── */
        .error {
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid #7a2020;
            border-radius: var(--radius);
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        .success {
            background: #1a2d1f;
            color: #4ecb82;
            border: 1px solid #207a40;
            border-radius: var(--radius);
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>PGP Login</h1>

    <div class="error"   th:if="${error}"   th:text="${error}"></div>
    <div class="success" th:if="${success}" th:text="${success}"></div>

    <form action="/login/pgpchallenge" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
        </div>
        <button class="btn btn-submit" type="submit">Login</button>
    </form>

    <div class="card-footer">
        <a class="btn btn-secondary" href="/index">Back</a>
    </div>
</div>
</body>
</html>
