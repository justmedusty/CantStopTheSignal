<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        a {
            color: #ffffff;
            text-decoration: underline;
        }

        :root {
            --bg: #12141a;
            --surface: #1c1f26;
            --surface-hover: #252a33;
            --border: #343a46;
            --text-primary: #d1d5db;
            --text-secondary: #a1a7b1;
            --accent: #434491;
            --accent-soft: #1e2a44;
            --danger: #c04a4a;
            --danger-soft: #3d1a1a;
            --muted: #717a8c;
            --warning: #d4a04a;
            --warning-soft: #2a1f0a;
            --success: #4ecb82;
            --success-soft: #1a2d1f;
            --radius: 1px;
            --shadow: 0 2px 4px rgba(0, 0, 0, 0.5);

            --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --font-serif: 'Georgia', serif;
            --font-mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            margin: 0;
            align-content: center;
            padding: 2rem 1rem 4rem;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* ── Site Banner ── */
        .site_banner {
            max-width: 760px;
            margin: 0 auto 2rem;
            padding: 2rem 2.5rem;
            text-align: center;
            background: linear-gradient(180deg, var(--accent-soft), var(--surface));
            border: 1px solid var(--border);
            border-top: 3px solid lightskyblue;
            color: var(--text-primary);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            font-family: var(--font-serif);
        }

        .site_banner h1 {
            margin: 0 0 0.6rem;
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        .site_banner h2 {
            margin: 0 0 0.8rem;
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--text-secondary);
            font-style: italic;
        }

        .site_banner h3 {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            font-family: var(--font),fangsong;
        }

        /* ── Card ── */
        .card {
            background: var(--surface);
            padding: 2rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            align-content: center;
            text-align: center;
            min-width: 320px;
            max-width: 500px;
            color: var(--text);
            margin: auto;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .buttons {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 0.55rem 1.25rem;
            border-radius: var(--radius);
            text-decoration: none;
            font-family: var(--font);
            font-size: 0.875rem;
            font-weight: 600;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .login {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: #2d3f7a;
        }

        .login:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .signup {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: #2d3f7a;
        }

        .signup:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ── Flash messages ── */
        .error {
            background: var(--danger-soft);
            color: var(--danger);
            border: 1px solid #7a2020;
            border-radius: var(--radius);
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }

        .success {
            background: #1a2d1f;
            color: #4ecb82;
            border: 1px solid #207a40;
            border-radius: var(--radius);
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        /* ── Flash messages ── */
        .info {
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid #4c86e7;
            border-radius: var(--radius);
            padding: 0.6rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

<div class="site_banner">
    <h1 th:text="${server_config.name}">Server Name</h1>
    <h2 th:text="${server_config.topic}">Server Topic</h2>
    <h3 th:text="${server_config.motd}">Message of the Day</h3>
    <h4 th:if="${invite_only == true}"><br>This service is invite only.</h4>
</div>
<div class="error" th:if="${error}" th:text="${error}"></div>
<div class="success" th:if="${success}" th:text="${success}"></div>
<div class="info" th:if="${server_config.infoMessage != null}" th:text="${server_config.infoMessage}"></div>

<div class="card">
    <p>Please log in or create an account to continue.</p>
    <div class="buttons">
        <a class="btn login" href="/login/pgpchallenge">PGP Login</a>
        <a th:if="${server_config.pgpLoginOnly == false}" class="btn login" href="/login">Password Login</a>
        <a class="btn signup" href="/signup">Sign Up</a>
    </div>
</div>

</body>
</html>
